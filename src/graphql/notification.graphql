query GetSystemNotifications($limit: Int, $offset: Int) {
  getSystemNotifications(limit: $limit, offset: $offset) {
    items {
      id
      userId
      title
      message
      type
      isRead
      createdAt
    }
    totalCount
  }
}

# 2. Счетчик для Badge на колокольчике
query GetUnreadNotificationsCount {
  getUnreadNotificationsCount
}

# 3. Мутация "Прочитать всё"
mutation MarkAllNotificationsAsRead {
  markAllNotificationsAsRead
}

# 4. Мутация прочтения одного уведомления
mutation MarkNotificationAsRead($id: ID!) {
  markNotificationAsRead(id: $id)
}
