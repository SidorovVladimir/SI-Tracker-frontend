query GetInspectionPool(
  $targetMonth: String!
  $limit: Int!
  $offset: Int!
  $filter: DeviceFilterInput
) {
  getInspectionPoolByMonth(
    targetMonth: $targetMonth
    limit: $limit
    offset: $offset
    filter: $filter
  ) {
    items {
      id
      name
      model
      serialNumber
      lastInspectionDate
      validUntil
      isOverdue
      controlType
    }
    totalCount
    #yearlySummary {
    #month
    # autoCount
    #manualCount
    #}
  }
}

query GetInspectionArchive($limit: Int!, $offset: Int!, $year: Int!) {
  getInspectionBatchesArchive(limit: $limit, offset: $offset, year: $year) {
    items {
      id
      number
      date
      comment
      createdBy {
        id
        role
        firstName
        lastName
      }
      devicesToBatches {
        id
        deviceStatus
        device {
          id
          name
          model
          serialNumber
        }
      }
    }
    totalCount
  }
}

query GetSingleInspectionBatch($batchNumber: String!) {
  getInspectionBatchByNumber(batchNumber: $batchNumber) {
    id
    number
    date
    comment
    createdBy {
      id
      role
      firstName
      lastName
    }
    devicesToBatches {
      id
      deviceStatus
      device {
        id
        name
        model
        serialNumber
      }
    }
  }
}

query GetInspectionCalendarSummary {
  getInspectionCalendarSummary {
    month
    autoCount
    manualCount
  }
}

mutation CreateBulkInspection($items: [InspectionItemInput!]!) {
  createBulkInspection(items: $items)
}
