query GetInspectionPool($targetMonth: String!, $limit: Int!, $offset: Int!) {
  getInspectionPoolByMonth(
    targetMonth: $targetMonth
    limit: $limit
    offset: $offset
  ) {
    items {
      id
      name
      model
      serialNumber
      lastInspectionDate
      validUntil
      isOverdue
      controlType
    }
    totalCount
    yearlySummary {
      month
      autoCount
      manualCount
    }
  }
}

query GetInspectionArchive($limit: Int!, $offset: Int!) {
  getInspectionBatchesArchive(limit: $limit, offset: $offset) {
    items {
      id
      number
      date
      comment
      devices {
        id
        name
        model
        serialNumber
        isSuccess
      }
    }
    totalCount
  }
}

# 2. Мутация массовой фиксации осмотра мастером цеха
mutation CreateBulkInspection(
  $items: [InspectionItemInput!]!
  $intervalMonths: Int!
) {
  createBulkInspection(items: $items, intervalMonths: $intervalMonths)
}
